name: catalog-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog-ci:
    name: catalog-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run deterministic fixture suite
        run: PYTHONDONTWRITEBYTECODE=1 GRAPHWING_HOME=. python3 test_server.py

      - name: Compile Python sources
        run: >-
          PYTHONPYCACHEPREFIX=/tmp/graphwing-pyc python3 -m py_compile
          server.py scripts/publish_graphs.py scripts/reimport_integration.py test_server.py

      - name: Parse catalog JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in [Path("openapi.json"), *sorted(Path("graphs").glob("*.json"))]:
              json.loads(path.read_text())
          PY

      - name: Check committed diff whitespace
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$EVENT_BASE_SHA" ] &&
             [[ ! "$EVENT_BASE_SHA" =~ ^0+$ ]] &&
             git cat-file -e "$EVENT_BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$EVENT_BASE_SHA" HEAD --
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check "$(git rev-parse HEAD^)" HEAD --
          else
            git show --check --format= HEAD
          fi
